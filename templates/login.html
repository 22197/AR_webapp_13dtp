{%extends "layout.html"%}
{%block content%}
<form method = "POST" novalidate>
    {{ form.hidden_tag() }}
    {{ form.user_name() }}<br>
    {% for error in form.user_name.errors %}
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
    {{ form.password() }}
    {% for error in form.password.errors %}<br>
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
    {{ form.submit }} <br>
</form>
{% endblock%}
