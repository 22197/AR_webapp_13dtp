<nav>
    <div class="nav-left">
        <a href="{{ url_for('report') }}" class="link"><img class="logo" src="/static/images/Logo.png" alt="Logo" ></a>
        <a href="{{ url_for('report') }}" class="h_link">Report Incident</a>
        <a href="{{ url_for('about') }}" class="h_link">About This Website</a>
    </div>
    {% if current_user.is_authenticated %}
        <div class="nav-right">
            <a href="{{ url_for('view') }}" class="h_link">All Reports</a>

            {% if current_user.admin == 1 %}
            <a href="{{ url_for('signup') }}" class="h_link">Sign up</a>
            {% endif %}
        </div>

        <div class="user_info">
            <p>{{ current_user.teacher_code }}</p>
            <a href="{{ url_for('logout') }}" class="link" >Logout</a>
        </div>
    {% elif  not current_user.is_authenticated %}
        <a href="{{ url_for('login') }}" class="h_link">teacher login</a>
    {% endif %}
</nav>
